services:
  app:
    build: .
    command: python -m jobagent.cli eval
    environment:
      JOBAGENT_DATABASE_URL: postgresql://jobagent:jobagent@postgres:5432/jobagent
    depends_on:
      - postgres
    volumes:
      - ./.jobagent:/app/.jobagent

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobagent
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
    ports:
      - "5432:5432"
    volumes:
      - jobagent-postgres:/var/lib/postgresql/data

volumes:
  jobagent-postgres:
