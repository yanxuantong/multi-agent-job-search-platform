[project]
name = "jobagent"
version = "0.1.0"
description = "Reference multi-agent job-search platform for learning orchestration, HITL, evals, and tracing."
requires-python = ">=3.9"
dependencies = [
  "fastapi",
  "jinja2",
  "psycopg[binary]",
  "uvicorn[standard]",
]

[project.optional-dependencies]
langgraph = [
  "langgraph",
  "langgraph-checkpoint-postgres",
]
llm = [
  "anthropic",
  "openai",
]
observability = [
  "langfuse",
]
postgres = [
  "psycopg[binary]",
  "pgvector",
]
mcp = [
  "mcp",
]
dev = [
  "pytest",
]
all = [
  "anthropic",
  "langfuse",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "mcp",
  "openai",
  "pgvector",
  "psycopg[binary]",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["jobagent*", "mcp_server*"]

[tool.setuptools.package-data]
"jobagent.web" = ["templates/*.html", "static/*.css"]
