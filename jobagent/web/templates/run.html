<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ summary.company }} - JobAgent Scout Run</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/assets/scout.css">
</head>
<body>
  {% set state_data = state.to_dict() %}
  <div
    id="scout-root"
    data-page="run"
    data-props='{{ {
      "state": {
        "fit_analysis": state_data.fit_analysis,
        "resume_proposal": state_data.resume_proposal,
        "retrieval_contexts": state_data.retrieval_contexts,
        "tracker_update": state_data.tracker_update,
        "interview_pack": state_data.interview_pack,
        "eval_summary": state_data.eval_summary,
        "messages": state_data.messages
      },
      "summary": summary,
      "scores": scores,
      "runSteps": run_steps,
      "traceRows": trace_rows,
      "canApprove": can_approve,
      "publicDemoMode": public_demo_mode
    } | tojson | forceescape }}'
  ></div>
  <noscript>
    <main class="wrap workspace">
      <section class="panel">
        <h1>{{ summary.company }} - {{ summary.role }}</h1>
        <p class="lead">Enable JavaScript to use the React run review surface.</p>
        {% if can_approve %}
          <form method="post" action="/runs/{{ summary.run_id }}/approve">
            <button type="submit">Approve and continue</button>
          </form>
        {% endif %}
        <h2>Run evaluation</h2>
        <h2>Retrieval context</h2>
        <h2>RAG evidence</h2>
        <h2>Orchestrator and tool audit</h2>
        <ol>{% for message in state.messages %}<li>{{ message }}</li>{% endfor %}</ol>
        <div>{% for row in trace_rows %}<span>{{ row.tool }}</span>{% endfor %}</div>
      </section>
    </main>
  </noscript>
  <script type="module" src="/static/assets/scout.js"></script>
</body>
</html>
