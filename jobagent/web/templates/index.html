<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobAgent Scout</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/assets/scout.css">
</head>
<body>
  <div
    id="scout-root"
    data-page="home"
    data-props='{{ {
      "sampleText": sample_text,
      "runs": runs,
      "stats": stats,
      "workflowSteps": workflow_steps,
      "agentCards": agent_cards,
      "publicDemoMode": public_demo_mode
    } | tojson | forceescape }}'
  ></div>
  <noscript>
    <main class="wrap workspace">
      <section class="panel command-panel">
        <h1>JobAgent Scout</h1>
        <p class="lead">Scout needs JavaScript enabled for the React command cockpit. The workflow backend remains available through the same form contract.</p>
        <form method="post" action="/runs">
          <label for="job_url">Job URL</label>
          <input id="job_url" name="job_url" type="url" placeholder="https://company.com/careers/job-id">
          <label for="job_text">Job description</label>
          <textarea id="job_text" name="job_text">{{ sample_text }}</textarea>
          <button type="submit">Run workflow</button>
        </form>
      </section>
    </main>
  </noscript>
  <script type="module" src="/static/assets/scout.js"></script>
</body>
</html>
